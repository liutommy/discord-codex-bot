services:
  bot:
    container_name: ${BOT_CONTAINER_NAME:-discord-codex-bot}
    build:
      context: .
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.153.4}
        UV_VERSION: ${UV_VERSION:-0.10.0}
    image: discord-codex-bot:local
    restart: always
    init: true
    env_file:
      - .env
    environment:
      CODEX_HOME: /var/lib/codex
      CODEX_WORKSPACE: /workspace
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: volume
        source: codex-home
        target: /var/lib/codex
      - type: volume
        source: agy-home
        target: /home/node/.gemini
      - type: bind
        source: ./backups
        target: /backups
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512  # full Chromium alone needs >128 tasks (threads count); Codex + agy on top
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - searxng

  # Self-hosted web search for the Bot's <web> tool. No host port: only the bot container can
  # reach it (http://searxng:8080 on the compose network), so it publishes nothing.
  searxng:
    image: searxng/searxng:latest
    container_name: ${BOT_CONTAINER_NAME:-discord-codex-bot}_searxng
    restart: always
    environment:
      BASE_URL: http://searxng:8080/
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  codex-home:
    name: ${BOT_CONTAINER_NAME:-discord-codex-bot}_codex_home
  agy-home:
    name: ${BOT_CONTAINER_NAME:-discord-codex-bot}_agy_home
