services:
  bot:
    container_name: ${BOT_CONTAINER_NAME:-discord-codex-bot}
    build:
      context: .
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.153.4}
        UV_VERSION: ${UV_VERSION:-0.10.0}
    image: discord-codex-bot:local
    restart: always
    init: true
    env_file:
      - .env
    environment:
      CODEX_HOME: /var/lib/codex
      CODEX_WORKSPACE: /workspace
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: volume
        source: codex-home
        target: /var/lib/codex
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  codex-home:
    name: ${BOT_CONTAINER_NAME:-discord-codex-bot}_codex_home
