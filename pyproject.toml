[project]
name = "discord-codex-bot"
version = "0.1.0"
description = "Private Discord gateway for a subscription-authenticated Codex CLI container"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.6,<3",
    "playwright>=1.47,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.13,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
