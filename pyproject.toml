[project]
name = "discord-codex-bot"
version = "0.1.0"
description = "Private Discord gateway for a subscription-authenticated Codex CLI container"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9,<4",
    "youtube-transcript-api>=1.0,<2",
    "yt-dlp>=2025.1,<2026",
    "pypdf>=5,<7",
    "discord.py>=2.6,<3",
    "playwright>=1.47,<2",
]

[dependency-groups]
dev = [
    "opencc-python-reimplemented>=0.1.7",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.13,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
