# dockerd never runs without the dcb firewall: if dcb-firewall.service fails, docker does not start.
[Unit]
Requires=dcb-firewall.service
After=dcb-firewall.service
# Re-apply rules with `systemctl reload dcb-firewall` (or run /usr/local/sbin/dcb-firewall);
# `systemctl restart dcb-firewall` would also restart docker and stop every container.
